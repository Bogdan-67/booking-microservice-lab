# TLS termination для ЛР №2
# Linux: /etc/nginx/conf.d/ ; macOS/Homebrew: .../etc/nginx/servers/

server {
    listen 127.0.0.1:8080;
    server_name localhost 127.0.0.1;
    return 308 https://$host:8443$request_uri;
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate     /home/bogdan/Documents/study/microservices/09_seat_reservation_service/certs/dev-cert.pem;
    ssl_certificate_key /home/bogdan/Documents/study/microservices/09_seat_reservation_service/certs/dev-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
}
