<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Бронирование мест</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Бронирование мест</h1>

  <form id="create-form">
    <input name="event_id" placeholder="event_id" required>
    <input name="seat" placeholder="Место, например A-12" required>
    <input name="customer_id" placeholder="customer_id" required>
    <button type="submit">Создать</button>
  </form>

  <p id="message"></p>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Событие</th>
        <th>Место</th>
        <th>Клиент</th>
        <th>Статус</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
