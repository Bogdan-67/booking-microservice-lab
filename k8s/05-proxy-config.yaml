apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-config
  namespace: msa-v9-tugai
data:
  default.conf: |
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=8r/s;

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format gateway '$remote_addr [$time_local] "$request" $status '
                       'request_id=$req_id rt=$request_time urt=$upstream_response_time';

    upstream rest_facade {
        server rest-facade:8000;
    }

    server {
      listen 80;
      access_log /var/log/nginx/access.log gateway;

      set_real_ip_from 10.42.0.0/16;
      real_ip_header X-Forwarded-For;

      location /api/v1/ {
        limit_req zone=api_per_ip burst=4 nodelay;
        limit_req_status 429;

        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;

        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header X-Request-ID $req_id always;

        proxy_pass http://rest_facade;
      }

      location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      }

      location / {
        proxy_pass http://frontend:80;
      }
    }
