apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-grpc
  namespace: msa-v9-tugai
  labels:
    app.kubernetes.io/name: booking-grpc
    app.kubernetes.io/part-of: seat-reservation
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: booking-grpc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking-grpc
        app.kubernetes.io/part-of: seat-reservation
    spec:
      containers:
        - name: grpc
          image: docker.io/bogdan67/seat-reservation-grpc:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - {name: TEST_DELAY_MS, value: "0"}
            - {name: TEST_FAIL_UNAVAILABLE, value: "0"}
          readinessProbe:
            grpc: {port: 50051}
            periodSeconds: 5
          livenessProbe:
            grpc: {port: 50051}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: booking-grpc
  namespace: msa-v9-tugai
  labels:
    app.kubernetes.io/name: booking-grpc
    app.kubernetes.io/part-of: seat-reservation
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: booking-grpc
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
