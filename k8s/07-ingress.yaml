apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: msa-v9-tugai
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - reservations.lab.local
      secretName: reservations-tls
  rules:
    - host: reservations.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy
                port:
                  number: 80
