apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: msa-v9-tugai
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: seat-reservation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: seat-reservation
    spec:
      containers:
        - name: frontend
          image: docker.io/bogdan67/seat-reservation-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: msa-v9-tugai
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP